# Copia le guide TV (XMLTV) e i loghi dei canali nel ramo «epg», da cui l'app le legge (raw.githubusercontent.com permette la lettura da un sito web).
# Nessun server: e' una procedura di GitHub che parte ogni 4 ore. Il ramo «epg» viene riscritto ogni volta (niente storico che cresce).
name: Guida TV
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lista.m3u, epg-sources.txt, .github/workflows/epg.yml, tools/logos.py]
permissions:
  contents: write
concurrency: epg
jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scarica le guide
        run: |
          set -u
          mkdir -p out
          { grep -o -E '(url-tvg|x-tvg-url)="[^"]+"' lista.m3u | sed -E 's/^[^"]*"//; s/"$//' | tr ',' '\n'
            grep -v -E '^\s*(#|$)' epg-sources.txt; } | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -E '^https?://' | sort -u > sources.txt
          cat sources.txt
          ok=0
          while read -r url; do
            name=$(printf '%s' "$url" | sed -E 's#^https?://##; s/[?#].*$//; s/[^A-Za-z0-9.]+/_/g')
            if curl -fsSL --retry 3 --max-time 300 -A "Mozilla/5.0 (TivuPlayer EPG)" -o "out/$name" "$url" && [ -s "out/$name" ]; then
              echo "ok  $name $(stat -c %s "out/$name") byte"; ok=$((ok+1))
            else
              echo "::warning::guida non scaricata: $url"; rm -f "out/$name"
            fi
          done < sources.txt
          [ "$ok" -gt 0 ] || { echo "::error::nessuna guida scaricata"; exit 1; }
      - name: Copia i loghi dei canali
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python3 tools/logos.py lista.m3u out
      - name: Pubblica nel ramo epg
        run: |
          cd out
          git init -q -b epg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Guide TV $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:epg
