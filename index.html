<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout (stile Joy / myTube): app a schermo intero, nome dell'app e schede dei gruppi a pillola in alto, canali sotto (griglia o elenco), lettore sovrapposto. */
:root {
  /* stessi colori di Joy e myTube (tema «Vinile»): marrone scuro caldo, accento corallo, testo color crema */
  --bg-black: #100E0C;
  --bg: #1A1714;
  --surface: #211C18;
  --surface-2: #2E2721;
  --card: #26211C;
  --fg: #F3EBDD;
  --muted: #BDB2A1;
  --line: rgba(243, 235, 221, .09);
  --accent: #E5533D;
  --accent-hover: #EC6A55;
  --on-accent: #1A1714;
  --accent-soft: #48271F;   /* le TV piu' vecchie non conoscono color-mix: resta questo colore */
  --accent-soft: color-mix(in srgb, #E5533D 20%, #211C18);
  --star: #E0A93B;
  --danger: #FF8A7A;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 14px 34px rgba(0, 0, 0, .5);
  --bar: var(--bg); --bar-deep: var(--bg); --on-bar: var(--fg); --on-bar-dim: var(--muted);
  --tile: #F3EBDD; --tile-line: transparent;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --tile-size: 52px;
  --tile-min: 76px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.4 var(--font); -webkit-tap-highlight-color: transparent; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar-deep); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
input, textarea, select { font: inherit; color: var(--fg); }
img { max-width: 100%; }
.i { width: 24px; height: 24px; fill: currentColor; flex: none; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.top { background: var(--bar); color: var(--on-bar); flex: none; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); position: relative; z-index: 2; }
.appbar, .searchbar { height: 56px; display: flex; align-items: center; gap: 2px; padding: 0 4px; }
.title { flex: 1; min-width: 0; font-size: 20px; font-weight: 500; padding-left: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .1px; }
.ib { width: 48px; height: 48px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: inherit; flex: none; }
.ib:hover { background: rgba(127, 127, 127, .14); }
.ib:active { background: rgba(127, 127, 127, .24); }
.searchbar input { flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; color: var(--on-bar); font-size: 18px; outline: none; padding: 0 8px; }
.searchbar input::placeholder { color: var(--on-bar-dim); }
.searchbar input::-webkit-search-cancel-button { display: none; }
.tabs { display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; color: var(--on-bar-dim); height: 48px; padding: 0 16px; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: .6px; cursor: pointer; position: relative; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--on-bar); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--on-bar); }
.tab .n { font-weight: 400; opacity: .7; margin-left: 4px; }
.loadbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; overflow: hidden; }
.loadbar i { position: absolute; top: 0; bottom: 0; width: 35%; background: #9cc3ff; animation: lb 1.1s ease-in-out infinite; }
@keyframes lb { from { left: -35%; } to { left: 100%; } }
.status { background: var(--accent-soft); color: var(--fg); font-size: 13px; padding: 8px 16px; display: flex; gap: 12px; align-items: center; }
.status span { flex: 1; min-width: 0; }
.status button { border: 0; background: none; color: var(--accent); font-weight: 500; text-transform: uppercase; font-size: 13px; letter-spacing: .4px; cursor: pointer; padding: 6px 4px; }

#main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.res-h { padding: 14px 16px 4px; color: var(--muted); font-size: 13px; }
#list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile-min), 1fr)); gap: 2px 0; padding: 8px 4px 24px; }
#list.rows { display: flex; flex-direction: column; padding-bottom: 24px; }
.ch { border: 0; background: none; cursor: pointer; text-align: left; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; position: relative; }
.grid .ch { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 2px 8px; border-radius: 10px; min-width: 0; }
.grid .ch:hover { background: rgba(127, 127, 127, .1); }
.grid .nm { font-size: 12.5px; color: var(--fg); text-align: center; width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; word-break: break-word; }
.rows .ch { display: flex; align-items: center; gap: 16px; min-height: 68px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
.rows .ch:hover { background: var(--surface-2); }
.rows .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rows .nm { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 4px; max-width: 220px; }
.pb i { display: block; height: 100%; background: var(--accent); }
.av { width: var(--tile-size); height: var(--tile-size); flex: none; border-radius: 10px; background: var(--tile); border: 1px solid var(--tile-line); display: grid; place-items: center; overflow: hidden; position: relative; }
.rows .av { width: calc(var(--tile-size) * .9); height: calc(var(--tile-size) * .9); }
.av img { width: 86%; height: 86%; object-fit: contain; position: absolute; top: 7%; right: 7%; bottom: 7%; left: 7%; opacity: 0; transition: opacity .15s; }
.av.has-logo img { opacity: 1; }
.av b { transition: opacity .15s; }
.av.has-logo b { opacity: 0; }
.av.now img, .av.now b { transition: none; }
.av b { width: 72%; height: 72%; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 500; font-size: calc(var(--tile-size) * .36); background: var(--c, #5c6bc0); }
.rows .av b { font-size: calc(var(--tile-size) * .33); }
.favdot { position: absolute; top: 6px; right: 8px; color: var(--star); }
.grid .favdot .i { width: 16px; height: 16px; }
.rows .favdot { position: static; }
.rows .favdot .i { width: 20px; height: 20px; }
.empty { padding: 56px 24px; text-align: center; color: var(--muted); max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .i { width: 56px; height: 56px; opacity: .45; }
.empty h3 { margin: 0; color: var(--fg); font-size: 17px; font-weight: 500; text-wrap: balance; }
.empty p { margin: 0; line-height: 1.5; }

/* strati: menu laterale, menu, fogli, finestre */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(320px, 86vw); background: var(--surface); z-index: 21; display: flex; flex-direction: column; box-shadow: var(--shadow); animation: slide .2s ease-out; padding-bottom: env(safe-area-inset-bottom, 0px); }
@keyframes slide { from { transform: translateX(-100%); } }
.dr-head { background: var(--bar); color: var(--on-bar); padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px 18px max(20px, env(safe-area-inset-left, 0px)); display: flex; gap: 14px; align-items: center; }
.dr-head svg.logo { width: 48px; height: 48px; flex: none; }
.dr-head b { display: block; font-size: 19px; font-weight: 500; }
.dr-head small { color: var(--on-bar-dim); font-size: 13px; }
.dr-body { flex: 1; overflow-y: auto; padding: 8px 0; }
.dr-label { font-size: 12px; font-weight: 500; color: var(--muted); padding: 12px 20px 6px; text-transform: uppercase; letter-spacing: .8px; }
.dr-item { display: flex; align-items: center; gap: 18px; width: 100%; border: 0; background: none; padding: 0 8px 0 20px; min-height: 52px; cursor: pointer; text-align: left; color: var(--fg); }
.dr-item:hover { background: var(--surface-2); }
.dr-item .i { color: var(--muted); }
.dr-item .tx { flex: 1; min-width: 0; }
.dr-item .tx b { display: block; font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dr-item .tx small { color: var(--muted); font-size: 12.5px; }
.dr-item.on { background: var(--accent-soft); }
.dr-item.on .i, .dr-item.on b { color: var(--accent); }
.dr-sep { height: 1px; background: var(--line); margin: 8px 0; }
.menu { position: fixed; z-index: 31; top: calc(env(safe-area-inset-top, 0px) + 8px); right: calc(env(safe-area-inset-right, 0px) + 8px); background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 0; min-width: 240px; max-width: calc(100vw - 16px); animation: pop .14s ease-out; transform-origin: top right; }
@keyframes pop { from { opacity: 0; transform: scale(.92); } }
.menu button { display: flex; width: 100%; align-items: center; gap: 16px; border: 0; background: none; padding: 0 20px 0 16px; height: 48px; cursor: pointer; font-size: 15px; text-align: left; color: var(--fg); }
.menu button:hover { background: var(--surface-2); }
.menu button .i { color: var(--muted); }
.menu .chk { margin-left: auto; color: var(--accent); }
.menu-sep { height: 1px; background: var(--line); margin: 6px 0; }
.menu-label { font-size: 12px; color: var(--muted); padding: 8px 16px 4px; text-transform: uppercase; letter-spacing: .8px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: var(--shadow); max-height: 82vh; overflow-y: auto; padding: 8px 0 calc(env(safe-area-inset-bottom, 0px) + 8px); animation: up .2s ease-out; max-width: 640px; margin: 0 auto; }
@keyframes up { from { transform: translateY(100%); } }
.sh-head { display: flex; gap: 14px; align-items: center; padding: 14px 20px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.sh-head .tx { min-width: 0; flex: 1; }
.sh-head b { display: block; font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.sh-head small { color: var(--muted); font-size: 13px; display: block; }
.sheet .menu-btn { display: flex; width: 100%; align-items: center; gap: 20px; border: 0; background: none; padding: 0 20px; min-height: 52px; cursor: pointer; font-size: 15px; text-align: left; color: var(--fg); }
.sheet .menu-btn:hover { background: var(--surface-2); }
.sheet .menu-btn .i { color: var(--muted); }
.sheet .menu-btn.danger, .sheet .menu-btn.danger .i { color: var(--danger); }
.guide { list-style: none; margin: 0; padding: 0 20px 12px; }
.guide li { display: grid; grid-template-columns: 54px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.guide time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 1px; }
.guide li.now time, .guide li.now b { color: var(--accent); }
.guide b { font-weight: 500; display: block; }
.guide p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.dlg-wrap { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .15s ease-out; }
.dlg { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 440px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; animation: pop .16s ease-out; }
.dlg.wide { max-width: 560px; }
.dlg-t { margin: 0; font-size: 20px; font-weight: 500; padding: 22px 24px 8px; text-wrap: balance; }
.dlg-b { padding: 8px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.dlg-b p { margin: 0; line-height: 1.5; color: var(--muted); }
.dlg-a { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 16px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 20px; height: 40px; padding: 0 18px; font-weight: 500; font-size: 14px; letter-spacing: .3px; cursor: pointer; }
.btn.text { background: none; color: var(--accent); }
.btn.text:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: var(--surface); }
.btn.primary:disabled { opacity: .5; cursor: default; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld label { font-size: 13px; font-weight: 500; color: var(--muted); }
.fld input, .fld textarea, .fld select { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 11px 12px; font-size: 15px; outline: none; }
.fld input:focus, .fld textarea:focus, .fld select:focus { border-color: var(--accent); }
.fld textarea { min-height: 130px; resize: vertical; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.fld .hint { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 8px; height: 36px; font-size: 13.5px; font-weight: 500; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; height: 32px; padding: 0 12px; font-size: 13px; cursor: pointer; color: var(--fg); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.err { color: var(--danger); font-size: 13.5px; line-height: 1.45; }
.set-sec { font-size: 12px; font-weight: 500; color: var(--accent); text-transform: uppercase; letter-spacing: .8px; margin-top: 6px; }
.sw { display: flex; align-items: center; gap: 14px; cursor: pointer; }
.sw .tx { flex: 1; min-width: 0; }
.sw .tx b { display: block; font-weight: 400; font-size: 15px; }
.sw .tx small { color: var(--muted); font-size: 12.5px; line-height: 1.4; display: block; }
.sw input { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; border-radius: 12px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; margin: 0; }
.sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
.sw input:checked { background: var(--accent); }
.sw input:checked::after { transform: translateX(16px); }
.help { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.55; display: flex; flex-direction: column; gap: 6px; }
.help b { color: var(--fg); font-weight: 500; }
kbd { font: 12px ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: var(--surface-2); color: var(--fg); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 60; background: #2b3038; color: #f2f4f7; border-radius: 8px; padding: 12px 18px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); animation: fade .2s ease-out; }

/* lettore */
.epg-wrap { position: fixed; inset: 0; z-index: 25; background: var(--bg); display: flex; flex-direction: column; padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); animation: fade .15s ease-out; }
.epg-wrap .top { padding-top: env(safe-area-inset-top, 0px); }
.epg-now-btn { background: rgba(255, 255, 255, .16); border: 0; color: var(--on-bar); font-weight: 500; font-size: 14px; letter-spacing: .3px; padding: 0 14px; height: 40px; border-radius: 20px; }
.epg-scroll { flex: 1; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom, 0px); }
.epg-grid { position: relative; }
.epg-row { display: flex; height: 64px; border-bottom: 1px solid var(--line); }
.epg-row.ruler { position: sticky; top: 0; z-index: 3; height: 34px; background: var(--surface); border-bottom: 1px solid var(--line); }
.epg-ch { position: sticky; left: 0; z-index: 2; flex: none; width: 84px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px; cursor: pointer; }
.epg-ch .av { width: 36px; height: 36px; font-size: 13px; border-radius: 8px; }
.epg-ch span { font-size: 11px; line-height: 1.15; color: var(--muted); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.epg-row.ruler .epg-ch { z-index: 4; cursor: default; font-size: 12px; font-weight: 500; color: var(--muted); }
.epg-line { position: relative; flex: none; }
.epg-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); padding: 8px 0 0 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.epg-tick.day { color: var(--accent); font-weight: 500; }
.epg-p { position: absolute; top: 4px; bottom: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; overflow: hidden; overflow: clip; text-align: left; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; min-width: 0; color: var(--fg); cursor: pointer; }
.epg-p .pt { position: sticky; left: 92px; display: flex; flex-direction: column; gap: 2px; width: fit-content; max-width: 100%; min-width: 0; }
.epg-p b { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.epg-p small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.epg-p.now { background: var(--accent-soft); border-color: var(--accent); }
.epg-p.past { opacity: .55; }
.epg-nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); z-index: 1; pointer-events: none; }
.epg-empty { padding: 32px 24px; text-align: center; color: var(--muted); line-height: 1.5; }
.p-epg.tap { cursor: pointer; }
.player { position: fixed; inset: 0; z-index: 50; background: #000; color: #fff; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.player.fit-cover video { object-fit: cover; }
.player.fit-fill video { object-fit: fill; }
.p-ui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; opacity: 0; transition: opacity .2s; pointer-events: none; }
.p-ui.show { opacity: 1; pointer-events: auto; }
.p-top { display: flex; align-items: center; gap: 2px; padding: calc(env(safe-area-inset-top, 0px) + 4px) max(4px, env(safe-area-inset-right, 0px)) 28px max(4px, env(safe-area-inset-left, 0px)); background: linear-gradient(rgba(0, 0, 0, .72), transparent); }
.p-title { flex: 1; min-width: 0; padding-left: 8px; }
.p-title div:first-child { font-size: 18px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-title div:last-child { font-size: 13px; color: rgba(255, 255, 255, .72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-mid { display: flex; align-items: center; justify-content: center; gap: 28px; }
.p-mid .ib { background: rgba(0, 0, 0, .38); }
.p-mid .big { width: 56px; height: 56px; }
.p-mid .big .i { width: 32px; height: 32px; }

      <button class="ib" id="btnGuide" type="button" aria-label="Guida TV"></button>

  <main id="main">

    <div id="list" class="grid"></div>
    <div id="sentinel" style="height:1px"></div>
    <div id="empty" class="empty" hidden></div>

</div>

<div class="mini" id="mini" hidden aria-label="In riproduzione">
  <button class="mini-open" id="miniOpen" type="button">
    <span class="mini-av" id="miniAv"></span>
    <span class="tx"><b id="miniName"></b><small id="miniProg"></small></span>
  </button>
  <button class="ib" id="miniPlay" type="button" aria-label="Pausa"></button>
  <button class="ib" id="miniX" type="button" aria-label="Chiudi"></button>
</div>
<section class="player" id="player" hidden aria-label="Lettore">
  <video id="video" playsinline webkit-playsinline preload="auto" autopictureinpicture></video>
  <canvas class="p-freeze" id="pFreeze" hidden aria-hidden="true"></canvas>
  <div class="p-cast" id="pCastInfo" hidden></div>
  <div class="p-spin" id="pSpin" hidden><i></i></div>
  <div class="p-note" id="pNote" hidden></div>
  <div class="p-ui" id="pUi">
    <div class="p-top">
      <button class="ib" id="pBack" type="button" aria-label="Chiudi il lettore"></button>
      <div class="p-title"><div class="p-nm"><span class="p-num" id="pNum" hidden></span><span id="pName"></span></div><div id="pSub"></div></div>
      <button class="ib" id="pFav" type="button" aria-label="Preferito"></button>
      <button class="ib" id="pCast" type="button" aria-label="Trasmetti alla TV" hidden></button>
      <button class="ib" id="pPip" type="button" aria-label="Picture in picture" hidden></button>
      <button class="ib" id="pExt" type="button" aria-label="Apri in un'altra app"></button>
    </div>
    <div class="p-mid">
      <button class="ib big" id="pPrev" type="button" aria-label="Canale precedente"></button>
      <button class="ib huge" id="pPlay" type="button" aria-label="Riproduci o metti in pausa"></button>
      <button class="ib big" id="pNext" type="button" aria-label="Canale successivo"></button>
    </div>
    <div class="p-bot">
      <button class="p-golive" id="pLive" type="button" hidden>Torna alla diretta</button>
      <div class="p-epg" id="pEpg"></div>
      <div class="p-seek" id="pSeek" hidden><span id="pCur">0:00</span><input type="range" id="pRange" min="0" max="1000" value="0" aria-label="Posizione"><span id="pDur">0:00</span></div>
      <div class="p-row">
        <button class="ib" id="pChBtn" type="button" aria-label="Lista dei canali" title="Lista dei canali"></button>
        <button class="ib" id="pOpt" type="button" aria-label="Audio, sottotitoli e qualità" title="Audio, sottotitoli e qualità"></button>
        <button class="ib" id="pMute" type="button" aria-label="Audio"></button>
        <button class="ib" id="pFit" type="button" aria-label="Formato immagine"></button>
        <button class="ib" id="pFull" type="button" aria-label="Schermo intero"></button>
      </div>
    </div>
  </div>
  <div class="p-zap" id="pZap" hidden></div>
  <aside class="p-chl" id="pChl" hidden aria-label="Lista dei canali">
    <div class="p-chl-grab"></div>
    <div class="p-chl-h">
      <div class="p-chl-seg" id="pChlSeg" role="tablist">
        <button type="button" role="tab" data-m="ch">Canali</button>
        <button type="button" role="tab" data-m="epg">Programmi</button>
      </div>
      <button class="ib" id="pChlX" type="button" aria-label="Chiudi"></button>
    </div>
    <div class="p-chl-sub" id="pChlSub" hidden></div>
    <div class="p-chl-tabs" id="pChlTabs" role="tablist"></div>
    <div class="p-chl-list" id="pChlList"></div>
  </aside>
  <div class="p-msg" id="pMsg" hidden></div>
</section>

// ======================= cambio canale rapido =======================
// La parte lenta di un cambio canale sono i «giri» in rete: la lista del canale (e, se c'e', la lista madre con le
// qualita'). Mentre guardi, l'app tiene gia' pronte quelle dei canali sopra e sotto, cosi' il nuovo canale parte

// Mentre si sta zappando, oltre alla lista si prende anche il primo pezzo video che servira': cosi' il canale

// appena ci si ferma su un canale: guardando la TV non si consuma nulla in piu'.

// ======================= finestrella (picture in picture) =======================
// Uscendo dal lettore, dall'app o aprendone un'altra, il canale continua in una finestrella sopra le altre app

function pipPossible() {

  try {
    if (video.requestPictureInPicture) {

      return true;

    document.body.style.overflow = "";
    if (P.layer) { const L = P.layer; P.layer = null; closeLayer(L); }   // «indietro» torna a usare l'app, non chiude il canale
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}

// Tornando nell'app dopo averla lasciata in sottofondo, alcuni telefoni mostrano una pagina vuota finche'
// qualcosa non cambia: si forza un ridisegno e si rimette a posto quello che era rimasto a meta'.

function backFromBackground() {
  clearTimeout(backT2);

      else if (P.pip) updateMini();
      if (!$("player").hidden && !P.pip && P.started && video.paused && !NET.rebuf) { const pr = video.play(); if (pr && pr.catch) pr.catch(() => {}); }
      if (S.pl && !$("list").children.length) render(true);   // elenco sparito: si ridisegna

  const ch = P.ch, x = nowNext(ch);

  $("miniName").textContent = ch.name;

  note(R.n ? "Connessione persa: riprovo… (tentativo " + (R.n + 1) + ")" : "Connessione persa: riprovo…");

async function reconnectNow() {

  try {

    if (token !== P.token) return;
    P.started = true; spin(false); NET.recon = null; NET.stalls = []; NET.lastMove = Date.now(); NET.t0pos = video.currentTime || 0;
    note("Connessione ripristinata"); setTimeout(() => { if (P.token === token) note(""); }, 2500);

}
addEventListener("online", () => {
  if ($("player").hidden || !P.started && !NET.recon) return;
  if (NET.recon) { note("Connessione tornata: riparto…"); reconnectNow(); return; }
  note(""); try { if (P.hls) P.hls.startLoad(); } catch (e) {}   // riprende subito a scaricare, senza aspettare il prossimo tentativo
});
addEventListener("offline", () => {
  if (!P.started || $("player").hidden || NET.recon) return;
  if (bufAhead() > 2) note("Sei senza connessione: continuo con il video già scaricato");   // il blocco vero lo gestisce onStall/netLost
  else netLost({ kind: "network", det: "dispositivo offline" });
});
video.addEventListener("error", () => { if (P.started && !$("player").hidden && P.step && !P.hls && !P.dash && !P.ts) netLost(classifyMedia(video.error, P.step.url)); });
video.addEventListener("timeupdate", () => { if (video.currentTime !== NET.lastT) { NET.lastT = video.currentTime; NET.lastMove = Date.now(); } liveLag(); });
// indietro rispetto alla diretta (dopo una pausa o con la scorta grande): pulsante «Torna alla diretta»
let lagT = 0;
function liveLag() {
  const t = Date.now(); if (t - lagT < 1000) return; lagT = t;
  let behind = 0;
  try {
    if (P.hls && P.started && liveDetails()) behind = (P.hls.latency || 0) - (P.hls.targetLatency || 0);
    else if (P.dash && P.started && P.dash.isDynamic && P.dash.isDynamic()) behind = (P.dash.getCurrentLiveLatency() || 0) - (P.dash.getTargetLiveDelay ? P.dash.getTargetLiveDelay() : 0);
  } catch (e) {}
  $("pLive").hidden = !(behind > 25);
}
function goLive() {
  try {
    if (P.hls && P.hls.liveSyncPosition) video.currentTime = P.hls.liveSyncPosition;
    else if (P.dash && P.dash.seekToOriginalLive) P.dash.seekToOriginalLive();
  } catch (e) {}

}
$("pLive").addEventListener("click", e => { e.stopPropagation(); goLive(); showUi(); });
setInterval(() => {   // video fermo senza errori: il server non manda piu' niente
  if (!P.started || $("player").hidden || NET.rebuf || NET.recon || !$("pMsg").hidden || document.hidden) return;
  if (video.paused && !P.autoPause) { NET.lastMove = Date.now(); return; }   // in pausa per scelta: va bene
  if (Date.now() - NET.lastMove > 8e3 && liveWindowFix()) return;   // rimasto indietro rispetto alla diretta: si salta avanti
  if (Date.now() - NET.lastMove > 25e3 && bufAhead() < 1) netLost({ kind: "timeout", det: "video fermo da 25 s" });
}, 5000);

// ======================= installa come app =======================
let installEvt = null;
const IS_STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); installEvt = e;
  if (!store.get("instAsked", false) && !FRAMED) { store.set("instAsked", true); setTimeout(() => setStatus("Installa Tivù Player: si apre a schermo intero, con la sua icona, come un'app.", 0, { label: "Installa", run: installApp }), 4000); }
});
addEventListener("appinstalled", () => { installEvt = null; toast("Tivù Player installata"); });
function canInstall() { return !IS_STANDALONE && !FRAMED && (!!installEvt || IS_IOS); }
function installApp() {
  if (installEvt) { const ev = installEvt; ev.prompt(); ev.userChoice.finally(() => { installEvt = null; }); return; }
  dialog({ title: "Installa come app", body: [h("p", { text: "In Safari tocca il pulsante Condividi (il quadrato con la freccia) e poi «Aggiungi alla schermata Home». Tivù Player si aprirà a schermo intero, con la sua icona." })], actions: [{ label: "Ho capito", primary: true }] });
}

// ======================= barra in alto, ricerca, tastiera =======================
function moreMenu() {
  const items = [];
  if (S.pl && S.pl.url) items.push({ icon: "refresh", label: "Aggiorna playlist", run: () => refreshPlaylist(S.pl) });
  if (S.pl && epgUrls(S.pl).length) items.push({ icon: "guide", label: "Aggiorna guida TV", run: () => loadEpg(S.pl, true) });
  items.unshift({ icon: "guide", label: "Guida TV (prossime ore)", run: () => openEpgGrid() });
  items.push({ icon: "add", label: "Aggiungi playlist", run: () => playlistDialog() });
  if (canInstall()) items.push({ icon: "tv", label: "Installa come app", run: installApp });
  items.push({ sep: true }, { label: "Ordina" });
  items.push({ icon: "sort", label: "Come nella playlist", checked: CFG.sort === "orig", run: () => { CFG.sort = "orig"; saveCfg(); render(true); } });
  items.push({ icon: "sort", label: "Per nome (A-Z)", checked: CFG.sort === "az", run: () => { CFG.sort = "az"; saveCfg(); render(true); } });
  items.push({ sep: true }, { icon: "settings", label: "Impostazioni", run: settingsDialog });
  popMenu(items);
}
let searchLayer = null, qT = 0;
function openSearch() {
  $("appbar").hidden = true; $("searchbar").hidden = false; $("tabs").hidden = true; $("q").value = S.q; setTimeout(() => $("q").focus(), 20);
  searchLayer = pushLayer(() => { S.q = ""; $("q").value = ""; $("searchbar").hidden = true; $("appbar").hidden = false; $("tabs").hidden = false; searchLayer = null; render(true); });
}
$("q").addEventListener("input", () => { clearTimeout(qT); qT = setTimeout(() => { S.q = $("q").value.trim(); render(true); }, 120); });
$("q").addEventListener("keydown", e => { if (e.key === "Enter") $("q").blur(); });
(() => {
  setIcon($("btnMenu"), "menu"); setIcon($("btnSearch"), "search"); setIcon($("btnCast"), "cast"); setIcon($("btnMore"), "more");
  setIcon($("btnSearchBack"), "back"); setIcon($("btnSearchClear"), "close");
  $("btnMenu").onclick = openDrawer; $("btnSearch").onclick = openSearch; $("btnMore").onclick = moreMenu; setIcon($("btnGuide"), "guide"); $("btnGuide").onclick = () => openEpgGrid();
  const openProg = e => { if (P.ch && S.epg[P.ch.key] && S.epg[P.ch.key].length) { e.stopPropagation(); openChPanel("epg"); } };
  $("pEpg").addEventListener("click", openProg);
  $("pEpg").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openProg(e); } });
  $("btnSearchBack").onclick = () => closeLayer(searchLayer);
  $("btnSearchClear").onclick = () => { $("q").value = ""; S.q = ""; render(true); $("q").focus(); };
  $("btnView").onclick = () => { CFG.view = CFG.view === "grid" ? "rows" : "grid"; saveCfg(); applyCfg(); const top = $("main").scrollTop; render(true); $("main").scrollTop = top; };
  $("btnCast").onclick = () => { if (Cast.ctx) { if (Cast.ctx.getCurrentSession()) Cast.ctx.endCurrentSession(true); else Cast.ctx.requestSession().catch(() => {}); } };
})();
// tasto «indietro» dei telecomandi: Tizen (Samsung) 10009, webOS (LG) 461, Android TV e browser
function isBackKey(e) { return e.key === "Escape" || e.key === "Backspace" || e.key === "XF86Back" || e.key === "BrowserBack" || e.key === "GoBack" || e.keyCode === 10009 || e.keyCode === 461; }
// numeri del telecomando: si digita il numero del canale e dopo un attimo si sintonizza
let numBuf = "", numT = 0;
function typeNumber(d) {
  numBuf = (numBuf + d).slice(-4); clearTimeout(numT);
  const z = $("pZap"); z.textContent = numBuf; z.hidden = false;
  numT = setTimeout(() => {
    const n = parseInt(numBuf, 10); numBuf = "";
    const ch = S.chans.find(c => c.i + 1 === n);
    if (!ch) { z.textContent = "Nessun canale " + n; setTimeout(() => { z.hidden = true; }, 1500); return; }
    z.hidden = true;
    const inList = P.list.indexOf(ch);
    if (inList >= 0) playIdx(inList); else { P.list = S.chans; P.listTab = TAB_ALL; playIdx(S.chans.indexOf(ch)); }
  }, 1200);
}
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea,select")) { if (isBackKey(e) && e.key !== "Backspace") { const L = topLayer(); if (L) closeLayer(L); } return; }
  if (!$("player").hidden && topLayer() === P.layer) {
    const k = e.key;
    if (k >= "0" && k <= "9") { e.preventDefault(); showUi(); typeNumber(k); return; }
    if (k === "ArrowUp" || k === "PageUp" || k === "ChannelUp" || k === "MediaTrackPrevious") { e.preventDefault(); zap(-1); }
    else if (k === "ArrowDown" || k === "PageDown" || k === "ChannelDown" || k === "MediaTrackNext") { e.preventDefault(); zap(1); }
    else if (k === " " || k === "k" || k === "MediaPlayPause" || k === "MediaPlay" || k === "MediaPause") { e.preventDefault(); togglePlay(); showUi(); }
    else if (k === "f" || k === "F") toggleFull();
    else if (k === "c" || k === "C" || (k === "Enter" && !(document.activeElement && document.activeElement.closest && document.activeElement.closest("#player button")))) { e.preventDefault(); openChPanel(); }
    else if (k === "m" || k === "M") { video.muted = !video.muted; showUi(); }
    else if (k === "MediaStop") { e.preventDefault(); closePlayer(); }
    else if (k === "Escape" && !document.fullscreenElement) { e.preventDefault(); closePlayer(); }
    else if (isBackKey(e) && !document.fullscreenElement) { e.preventDefault(); backFromPlayer(); }
    else if (isBackKey(e)) { e.preventDefault(); toggleFull(); }   // a schermo intero, «indietro» torna alla finestra
    else if (k === "ArrowLeft" || k === "ArrowRight") { e.preventDefault(); if (isFinite(video.duration) && video.duration > 0) { video.currentTime += k === "ArrowLeft" ? -10 : 10; showUi(); } else zap(k === "ArrowRight" ? 1 : -1); }
    else showUi();
    return;
  }
  if (isBackKey(e)) { const L = topLayer(); if (L) { e.preventDefault(); closeLayer(L); } }
  else if (e.key === "/" && !layers.length) { e.preventDefault(); openSearch(); }
  else if (DIRS[e.key]) {   // telecomando / tastiera: le frecce spostano la selezione sull'elemento piu' vicino in quella direzione
    const box = topBox(); if (spatialMove(box, DIRS[e.key])) e.preventDefault();
  }
  else if ((e.key === "ContextMenu" || e.key === "i" || e.key === "Info") && !layers.length) {
    const el = document.activeElement, b = el && el.closest && el.closest("#list .ch"); const ch = b && byKey().get(b.dataset.k);
    if (ch) { e.preventDefault(); channelSheet(ch); }
  }
});
const DIRS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
const FOCUSABLE = "button:not([disabled]):not([hidden]), [role=button][tabindex], input:not([type=hidden]), select, textarea, summary, a[href]";
function topBox() {   // il livello aperto in cima (finestra, foglio, menu, guida) oppure la schermata principale
  const open = [...document.querySelectorAll(".dlg-wrap, .sheet, .menu, .drawer, .epg-wrap, .p-chl:not([hidden])")];
  return open.length ? open[open.length - 1] : $("app");
}
function spatialMove(box, dir) {
  const items = [...box.querySelectorAll(FOCUSABLE)].filter(el => { if (el.closest("[hidden]")) return false; const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; });
  if (!items.length) return false;
  const cur = document.activeElement;
  if (!items.includes(cur)) { const first = box === $("app") ? (box.querySelector("#list .ch") || items[0]) : items[0]; first.focus(); first.scrollIntoView({ block: "nearest", inline: "nearest" }); return true; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, vert = dir === "up" || dir === "down";
  // prima gli elementi sulla stessa riga (o colonna), poi gli altri
  let best = null, bd = Infinity;
  for (const pass of [true, false]) {
    for (const el of items) {
      if (el === cur) continue;
      const q = el.getBoundingClientRect(), dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;
      if (!(dir === "down" ? dy > 4 : dir === "up" ? dy < -4 : dir === "right" ? dx > 4 : dx < -4)) continue;
      if (pass && !(vert ? q.left < r.right && q.right > r.left : q.top < r.bottom && q.bottom > r.top)) continue;
      const d = (vert ? Math.abs(dy) : Math.abs(dx)) + (vert ? Math.abs(dx) : Math.abs(dy)) * 2.2;
      if (d < bd) { bd = d; best = el; }
    }
    if (best) break;
  }
  if (!best) return false;
  best.focus({ preventScroll: true }); best.scrollIntoView({ block: "nearest", inline: "nearest" });
  return true;
}

// ======================= avvio =======================
(async function boot() {
  applyCfg();
  await refreshPlaylistsList();
  await dropDemo();
  if (!store.get("seededDefault", false)) { if (S.pls.some(p => p.id === DEFAULT_PL.id) || await installDefault(false)) store.set("seededDefault", true); }
  setTimeout(() => { if (!FRAMED) loadScript(LIB.hls).catch(() => {}); }, 2500);
  loadLogoMap();
  if (document.documentElement.classList.contains("tv")) setTimeout(() => {   // telecomando: si parte con un canale gia' selezionato
    if (layers.length || !$("player").hidden) return;
    const a = document.activeElement, busy = a && a.closest && a.closest("button,input,select,textarea,[role=button]");
    const f = $("list").querySelector(".ch"); if (f && !busy) f.focus({ preventScroll: true });
  }, 400);   // il lettore piu' usato e' pronto prima del primo canale
  const cur = store.get("cur", null), pl = S.pls.find(p => p.id === cur) || S.pls[0];
  if (pl) await selectPlaylist(pl, { boot: true }); else { renderTabs(); render(true); }
  initCast();
  if (FRAMED) setStatus("Anteprima: dentro un'altra pagina (come claude.ai) i video e i loghi dei canali sono bloccati. Per guardare i canali apri l'app dal suo sito.");
  if (!FRAMED && "serviceWorker" in navigator && window.isSecureContext && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
