<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout (stile Joy / myTube): app a schermo intero, nome dell'app e schede dei gruppi a pillola in alto, canali sotto (griglia o elenco), lettore sovrapposto. */
:root {
  /* stessi colori di Joy e myTube (tema «Vinile»): marrone scuro caldo, accento corallo, testo color crema */
  --bg-black: #100E0C;
  --bg: #1A1714;
  --surface: #211C18;
  --surface-2: #2E2721;
  --card: #26211C;
  --fg: #F3EBDD;

  --accent: #E5533D;
  --accent-hover: #EC6A55;
  --on-accent: #1A1714;

  --star: #E0A93B;
  --danger: #FF8A7A;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 14px 34px rgba(0, 0, 0, .5);

  --tile: #F3EBDD; --tile-line: transparent;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --tile-size: 52px;
  --tile-min: 76px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }

img { max-width: 100%; }
.i { width: 24px; height: 24px; fill: currentColor; flex: none; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { background: var(--bar); color: var(--on-bar); flex: none; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); position: relative; z-index: 2; }

#main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

#list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile-min), 1fr)); gap: 2px 0; padding: 8px 4px 24px; }

.rows .ch { display: flex; align-items: center; gap: 16px; min-height: 68px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }

/* strati: menu laterale, menu, fogli, finestre */

@keyframes fade { from { opacity: 0; } }

@keyframes slide { from { transform: translateX(-100%); } }
.dr-head { background: var(--bar); color: var(--on-bar); padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px 18px max(20px, env(safe-area-inset-left, 0px)); display: flex; gap: 14px; align-items: center; }

.menu { position: fixed; z-index: 31; top: calc(env(safe-area-inset-top, 0px) + 8px); right: calc(env(safe-area-inset-right, 0px) + 8px); background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 0; min-width: 240px; max-width: calc(100vw - 16px); animation: pop .14s ease-out; transform-origin: top right; }

.sh-head { display: flex; gap: 14px; align-items: center; padding: 14px 20px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }

.sheet .menu-btn:hover { background: var(--surface-2); }

.guide { list-style: none; margin: 0; padding: 0 20px 12px; }

.guide time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 1px; }
.guide li.now time, .guide li.now b { color: var(--accent); }

.dlg { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 440px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; animation: pop .16s ease-out; }
.dlg.wide { max-width: 560px; }
.dlg-t { margin: 0; font-size: 20px; font-weight: 500; padding: 22px 24px 8px; text-wrap: balance; }
.dlg-b { padding: 8px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.dlg-b p { margin: 0; line-height: 1.5; color: var(--muted); }

.btn { border: 0; border-radius: 20px; height: 40px; padding: 0 18px; font-weight: 500; font-size: 14px; letter-spacing: .3px; cursor: pointer; }

/* lettore */

.p-top { display: flex; align-items: center; gap: 2px; padding: calc(env(safe-area-inset-top, 0px) + 4px) max(4px, env(safe-area-inset-right, 0px)) 28px max(4px, env(safe-area-inset-left, 0px)); background: linear-gradient(rgba(0, 0, 0, .72), transparent); }
.p-title { flex: 1; min-width: 0; padding-left: 8px; }
/* logo del canale in onda, in basso accanto al programma: stesso riquadro dell'elenco e della finestrella.
   L'identificatore vince sulle regole .p-epg delle varie dimensioni di schermo, cosi' la riga resta tale. */
#pEpg { flex-direction: row; align-items: center; column-gap: 12px; }
.pi-x { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

    <div class="p-chl-tabs" id="pChlTabs" role="tablist"></div>

async function fetchEpg(urls, chans, onProgress) {

    for (const nm of [c.tvgName, c.name]) { const k = normName(nm); if (k) (byName.get(k) || byName.set(k, []).get(k)).push(c.key); }

function nowNext(ch) {

  const i = L.findIndex(p => p.s <= t && p.e > t);

// La guida TV pesa (si scarica e si legge tutta): su TV e telefoni lenti rubava secondi proprio mentre

    // banda e processore proprio al video. Si riprende quando la scorta video e' piena.

// L'app e' un sito: quando ne pubblico una versione nuova il telefono tiene ancora quella vecchia finche' non

  $("upd").hidden = false;

    const reg = "serviceWorker" in navigator && await navigator.serviceWorker.getRegistration();

    for (const e of list.slice(0, 12)) {

      body.append(h("div", { class: "nw-v" }, h("b", { text: "Versione " + e.v }), e.d ? h("small", { text: itDate(e.d) }) : null), ul);

// Il lettore sceglie da solo la qualita' guardando quanto va la connessione. Due cose lo rendono piu' sveglio:
// la velocita' misurata viene ricordata da un canale all'altro (altrimenti ogni cambio ripartirebbe dalla
// qualita' piu' bassa) e si tiene conto della scelta dell'utente e del tipo di connessione.

}

// il riquadro viene misurato piccolo - una finestra ridotta, un televisore che dichiara una pagina piu'
// piccola del pannello - il canale resta inchiodato in basso e non risale mai, e per di piu' sovrascrive
// il tetto del risparmio dati. Quindi lo si tiene sempre spento: cosi' ogni canale puo' arrivare alla

      const max = dataSaver() && lv.length ? 1600 : 0;

    } catch (e) {}

// Quando la connessione peggiora la qualita' scende subito, ma per risalire il lettore dovrebbe prima «accorgersi»

// scorta di video e' piena e non ci sono stati blocchi, si prova il gradino sopra: se regge resta, altrimenti
// riscende da solo e si riprova piu' tardi.

  const h = P.hls;
  if (!h || !P.started || document.hidden || $("player").hidden) return;
  if (!h.levels || h.levels.length < 2 || !h.autoLevelEnabled) return;
  if (dataSaver() || CFG.slowNet || NET.rebuf || NET.recon) return;
  const now = Date.now();
  const base = CFG.quality === "max" ? 6000 : 12000;   // con «Massima» si riprova a salire piu' spesso
  if (probeLv >= 0) {   // esito del tentativo precedente
    if (h.currentLevel >= probeLv) { probeWait = base; } else { probeWait = Math.min(probeWait * 2, 120000); }
    probeLv = -1;

  let pieno = 4;

// ======================= cambio canale rapido =======================
// La parte lenta di un cambio canale sono i «giri» in rete: la lista del canale (e, se c'e', la lista madre con le
// qualita'). Mentre guardi, l'app tiene gia' pronte quelle dei canali sopra e sotto, cosi' il nuovo canale parte
// senza aspettare. Le liste delle dirette invecchiano in fretta: si usano solo se fresche, altrimenti si scarica.

// Una lista che JavaScript non riesce a leggere non vuol dire canale morto: le app per telefono e TV non hanno

// mostrare un video il permesso CORS non serve. La sonda distingue i tre casi: "ok" (leggibile), "cors" (il server
// risponde ma non lascia leggere: ci pensa il lettore del dispositivo), "muto" (non risponde proprio).

async function plProbe(url, ms, pezzo) {
  const m = probeGet(url); if (m && !(pezzo && m === "ok" && !probeDeep.has(url))) return m;
  const lim = ms || 4500;
  let bloccato = false;
  try {
    const c0 = plCacheGet(url);
    let t, u2;
    if (c0) { t = c0.t; u2 = c0.u || url; }
    else {
      const c = new AbortController(), to = setTimeout(() => c.abort(), lim);
      const r = await fetch(url, { cache: "no-store", signal: c.signal }); clearTimeout(to);
      if (!r.ok) { probePut(url, "muto"); return "muto"; }   // il server ha detto di no (404, 403, geoblocco)
      t = await r.text(); u2 = r.url;
      if (!/#EXTM3U/i.test(t)) { probePut(url, "cors"); return "cors"; }   // non e' una lista: ci provi il dispositivo
      plCachePut(url, t, u2);
    }
    if (!pezzo) { probePut(url, "ok"); return "ok"; }
    probeDeep.add(url);
    const vivo = await segAlive(t, u2, lim);
    probePut(url, vivo ? "ok" : "fermo"); return vivo ? "ok" : "fermo";

// devOk dice se il lettore del dispositivo sa leggere l'HLS: solo allora un indirizzo illeggibile dal

    urls.forEach((u, i) => plProbe(u, ms, urls.length > 1).then(r => {

      if (buono(u) && urls.slice(0, i).every(x => out.has(x) && !buono(x))) return fine();   // la prima strada buona

      // lascia un altro momento, poi si parte lo stesso da quella (lui resta comunque in scaletta)

// ======================= finestrella (picture in picture) =======================
// Uscendo dal lettore, dall'app o aprendone un'altra, il canale continua in una finestrella sopra le altre app
// e intanto il resto di Tivu Player resta usabile: in basso compare una barretta con il canale in onda.
function pipPossible() {
  if (FRAMED || !P.ch || $("player").hidden) return false;
  if (document.pictureInPictureEnabled && video.requestPictureInPicture && !video.disablePictureInPicture) return true;
  return !!(video.webkitSupportsPresentationMode && typeof video.webkitSetPresentationMode === "function");
}
function enterPip(silent) {
  if (!pipPossible()) { if (!silent) toast("La finestrella non è disponibile su questo browser"); return false; }
  if (document.pictureInPictureElement === video) { pipMode(true); return true; }
  try {
    if (video.requestPictureInPicture) {
      video.requestPictureInPicture().then(() => pipMode(true), () => { if (!silent) toast("La finestrella non è disponibile su questo browser"); });
      return true;
    }
    video.webkitSetPresentationMode("picture-in-picture"); pipMode(true); return true;
  } catch (e) { if (!silent) toast("La finestrella non è disponibile su questo browser"); return false; }
}
function exitPip() {
  try { if (document.pictureInPictureElement) document.exitPictureInPicture(); } catch (e) {}
  try { if (video.webkitPresentationMode === "picture-in-picture") video.webkitSetPresentationMode("inline"); } catch (e) {}
}
function pipMode(on) {
  if (on === !!P.pip) return;
  P.pip = on;
  applyQuality();   // nella finestrella basta una qualita' da finestrella; tornando grande si risale
  const pl = $("player");
  pl.classList.toggle("pip", on);
  if (on) {
    if (CH.open) closeChPanel();
    document.body.style.overflow = "";
    if (P.layer) { const L = P.layer; P.layer = null; closeLayer(L); }   // «indietro» torna a usare l'app, non chiude il canale
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    updateMini(); $("mini").hidden = false;
    document.documentElement.classList.add("has-mini");
  } else {
    $("mini").hidden = true; document.documentElement.classList.remove("has-mini");
    if (!pl.hidden) { document.body.style.overflow = "hidden"; if (!P.layer) P.layer = pushLayer(playerLayerClose); }
  }
}
// Tornando nell'app dopo averla lasciata in sottofondo, alcuni telefoni mostrano una pagina vuota finche'
// qualcosa non cambia: si forza un ridisegno e si rimette a posto quello che era rimasto a meta'.
let backT2 = 0;
function backFromBackground() {
  clearTimeout(backT2);
  backT2 = setTimeout(() => {
    try {
      // la finestrella non c'e' piu' ma l'app crede di esserci: si torna al lettore grande
      if (P.pip && !document.pictureInPictureElement && video.webkitPresentationMode !== "picture-in-picture") openFromMini();
      else if (P.pip) updateMini();
      if (!$("player").hidden && !P.pip && P.started && video.paused && !NET.rebuf) { const pr = video.play(); if (pr && pr.catch) pr.catch(() => {}); }
      if (S.pl && !$("list").children.length) render(true);   // elenco sparito: si ridisegna
      const r = document.documentElement;
      r.style.opacity = "0.999"; requestAnimationFrame(() => { r.style.opacity = ""; });
    } catch (e) {}
  }, 60);
}
function updateMini() {
  if (!P.pip || !P.ch) return;
  const ch = P.ch, x = nowNext(ch);
  $("miniAv").replaceChildren(avatar(ch));
  $("miniName").textContent = ch.name;
  $("miniProg").textContent = x && x.now ? x.now.t : (ch.group || "");
  setIcon($("miniPlay"), video.paused ? "play" : "pause");
  $("miniPlay").setAttribute("aria-label", video.paused ? "Riproduci" : "Pausa");
}
// dopo il cambio canale la finestrella era sparita: si riapre, altrimenti si torna al lettore grande
function backToPip() {
  if (!P.pip || !P.pipKeep) return;
  if (document.pictureInPictureElement === video || video.webkitPresentationMode === "picture-in-picture") { P.pipKeep = 0; return; }
  const tk = P.token;
  setTimeout(() => {
    if (!P.pip || P.token !== tk) return;
    P.pipKeep = 0;
    if (document.pictureInPictureElement === video) return;
    try {
      if (video.requestPictureInPicture) video.requestPictureInPicture().then(() => {}, () => openFromMini());
      else { video.webkitSetPresentationMode("picture-in-picture"); }
    } catch (e) { openFromMini(); }
  }, 120);
}
function openFromMini() {   // dalla barretta (o uscendo dalla finestrella) si torna al lettore grande
  exitPip(); pipMode(false);
  if ($("player").hidden && P.ch) { openPlayer(P.list.length ? P.list : S.chans, P.idx); return; }
  if (P.started && video.paused && !P.autoPause) { const pr = video.play(); if (pr && pr.catch) pr.catch(() => {}); }   // il browser l'aveva fermato uscendo dalla finestrella
  showUi(true);
}
(() => {
  video.addEventListener("enterpictureinpicture", () => pipMode(true));
  // uscendo dalla finestrella (tasto «ingrandisci» o chiusura) si torna sempre al lettore grande: non si chiude
  // mai da solo. Per chiudere ci sono la ✕ della barretta e «indietro» a video fermo.
  const leftPip = () => {
    if (!P.pip) return;
    if (P.pipKeep && Date.now() - P.pipKeep < 12000) return;   // sta cambiando canale: la finestrella torna da sola
    setTimeout(() => { if (P.pip && !P.pipKeep && !document.pictureInPictureElement) openFromMini(); }, 150);
  };
  video.addEventListener("leavepictureinpicture", leftPip);
  video.addEventListener("webkitpresentationmodechanged", () => {
    if (video.webkitPresentationMode === "picture-in-picture") pipMode(true);
    else if (P.pip) { if (P.pipKeep && Date.now() - P.pipKeep < 12000) return; setTimeout(() => { if (P.pip && !P.pipKeep) openFromMini(); }, 150); }
  });
  $("miniOpen").addEventListener("click", openFromMini);
  $("miniPlay").addEventListener("click", e => { e.stopPropagation(); togglePlay(); setTimeout(updateMini, 50); });
  $("miniX").addEventListener("click", e => { e.stopPropagation(); exitPip(); pipMode(false); closePlayerNow(); });
  setIcon($("miniX"), "close");
  // il browser chiede di passare in finestrella quando si esce dall'app
  if ("mediaSession" in navigator) try { navigator.mediaSession.setActionHandler("enterpictureinpicture", () => enterPip(true)); } catch (e) {}
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (CFG.autoPip && !P.pip && !$("player").hidden && !video.paused && pipPossible()) enterPip(true);
      return;
    }
    backFromBackground();
  });
  addEventListener("pageshow", e => { if (e.persisted) backFromBackground(); });
  setInterval(() => { if (P.pip) updateMini(); }, 20000);
